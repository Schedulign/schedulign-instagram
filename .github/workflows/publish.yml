name: Publish to Instagram

on:
  # One post a day, about 11:30am Pacific (18:30 UTC in summer time, 10:30am in
  # winter). The second run is a backup in case GitHub drops the first; the
  # 20-hour gap below makes it do nothing when the first one posted.
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test without posting; publish = post the next one now; reconcile = match failed posts against the account'
        type: choice
        options: [check, publish, reconcile]
        default: check

permissions:
  contents: write

# Never let two runs post at the same time.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always the latest main, so a run that waited in the queue still sees
      # every post recorded since.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          # Scheduled runs keep the daily spacing; a manual "publish" posts at once.
          MIN_GAP_MINUTES: ${{ github.event_name == 'schedule' && '1200' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0; node publish.mjs || rc=$?
          node lib/upnext.mjs
          git add published.json UPNEXT.md
          if ! git diff --cached --quiet; then
            git commit -qm "Record Instagram post"
            git pull -q --rebase
            git push -q
          fi
          # 75 is a quota or rate-limit pause, which is expected, not a failure.
          [ "$rc" = 75 ] && rc=0
          exit $rc
