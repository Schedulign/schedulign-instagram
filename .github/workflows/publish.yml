name: Publish to Instagram

on:
  # One post a day, about 11:20am Pacific (18:17 UTC in summer time, 10:17am in
  # winter). GitHub delays or drops runs scheduled on the hour and half hour
  # (the 18:30 run never started on Sep 25), so the minutes are odd, and two
  # backups follow; the 12-hour gap below makes a backup do nothing once a
  # post went out.
  schedule:
    - cron: '17 18 * * *'
    - cron: '47 19 * * *'
    - cron: '13 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test without posting; publish = post the next one now; reconcile = match failed posts against the account'
        type: choice
        options: [check, publish, reconcile]
        default: check

permissions:
  contents: write

# Never let two runs post at the same time.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always the latest main, so a run that waited in the queue still sees
      # every post recorded since.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          # Scheduled runs never post within 12 hours of the last post, so the backup
          # run cannot double up and a manual post the evening before does not skip
          # a day. A manual "publish" posts at once.
          MIN_GAP_MINUTES: ${{ github.event_name == 'schedule' && '720' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0; node publish.mjs || rc=$?
          node lib/upnext.mjs
          git add published.json UPNEXT.md
          if ! git diff --cached --quiet; then
            git commit -qm "Record Instagram post"
            git pull -q --rebase
            git push -q
          fi
          # 75 is a quota or rate-limit pause, which is expected, not a failure.
          [ "$rc" = 75 ] && rc=0
          exit $rc
